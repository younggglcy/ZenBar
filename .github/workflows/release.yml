name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Build DMG
        run: ./scripts/package.sh "${VERSION}"

      - name: Calculate DMG checksum
        run: |
          DMG="dist/ZenBar-${VERSION}.dmg"
          DMG_SHA256=$(shasum -a 256 "$DMG" | cut -d ' ' -f 1)
          echo "DMG_SHA256=$DMG_SHA256" >> $GITHUB_ENV
          DMG_SIZE=$(stat -f%z "$DMG")
          echo "DMG_SIZE=$DMG_SIZE" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/ZenBar-*.dmg
          generate_release_notes: true
          body: |
            ## Installation

            ### Download DMG
            Download `ZenBar-${{ env.VERSION }}.dmg` and drag it to Applications.

            ### Homebrew
            ```bash
            brew tap younggglcy/tap
            brew install --cask zenbar
            ```

            ---
            **DMG SHA256**: `${{ env.DMG_SHA256 }}`

      - name: Update Homebrew Tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "HOMEBREW_TAP_TOKEN not set, skipping."
            exit 0
          fi

          SOURCE_REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          SOURCE_RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          git clone https://x-access-token:${GH_TOKEN}@github.com/younggglcy/homebrew-tap.git
          cd homebrew-tap

          cat > Casks/zenbar.rb << 'CASK_EOF'
          cask "zenbar" do
            version "${{ env.VERSION }}"
            sha256 "${{ env.DMG_SHA256 }}"

            url "https://github.com/younggglcy/ZenBar/releases/download/v#{version}/ZenBar-#{version}.dmg"
            name "ZenBar"
            desc "Minimal menubar icon manager"
            homepage "https://github.com/younggglcy/ZenBar"

            livecheck do
              url :url
              strategy :github_latest
            end

            app "ZenBar.app"

            zap trash: [
              "~/Library/Caches/ZenBar",
              "~/Library/Preferences/name.younggglcy.ZenBar.plist",
            ]
          end
          CASK_EOF

          git config user.name "younggglcy"
          git config user.email "younggglcy@gmail.com"
          export GIT_AUTHOR_NAME="younggglcy"
          export GIT_AUTHOR_EMAIL="younggglcy@gmail.com"
          export GIT_COMMITTER_NAME="younggglcy"
          export GIT_COMMITTER_EMAIL="younggglcy@gmail.com"
          git add Casks/zenbar.rb
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          COMMIT_BODY=$(cat <<EOF
          Source repo: ${SOURCE_REPO_URL}
          Workflow run: ${SOURCE_RUN_URL}
          DMG: ${SOURCE_REPO_URL}/releases/download/v${{ env.VERSION }}/ZenBar-${{ env.VERSION }}.dmg
          SHA256: ${{ env.DMG_SHA256 }}
          EOF
          )

          git commit -m "Update zenbar to ${{ env.VERSION }}" -m "${COMMIT_BODY}"
          git push
